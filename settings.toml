  "https://www.instagram.com/@emily_tenorio_molina",
  "linkedin.com/in/emily-tenorio-molina",
]

# ── Photos and files ────────────────────────────────────────
#
# Upload files to the "media" folder on GitHub, then write the
# file's name here.

banner_photo = "media/emily.jpg"   # A portrait or banner photo of you
resume = "media/resume.jpg"         # A PDF of your resume (adds a Resume button)
favicon = ""                        # Tiny browser-tab icon. Empty = made for you

# ── About you ───────────────────────────────────────────────
#
# Your bio. Keep the three quote marks (""") on their own lines.
# A blank line starts a new paragraph.

bio = """
I'm a multimedia student at UC Berkeley Graduate School of Journalism, where I'm developing a Spanish-language news platform for Latino Bay Area communities.  

I'm currently a newscast intern at KQED covering government, environment, and tech in Contra Costa County. 

My stories have been published in Bay City News, Contra Costa Pulse, Council for Advancement of Science Writing, Student Press Law Center, and Knee Deep Times. 

Current multimedia projects I'm working on include developing social media content for UC Berkeley Center of Emerging and Neglected Diseases, and contributing audio stories on data centers for UC Berkeley's Human Rights Center. 

When I'm not reporting, you'll find me taking pictures of local museums, baking seasonal goods, and watching my favorite show in the world, The Simpsons. 
"""

